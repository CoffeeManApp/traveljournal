<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Enam Tuju</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{--tx:#0b0f17;--mu:rgba(11,15,23,.55);--gl:rgba(255,255,255,.58);--gb:rgba(255,255,255,.8);--ac:#0a84ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;background:#111}
body{font:15px/1.3 -apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;color:var(--tx)}
#app{position:relative;height:100%;max-width:430px;margin:0 auto;overflow:hidden}
@media(min-width:520px){#app{height:min(860px,100%);margin:calc((100vh - min(860px,100vh))/2) auto;border-radius:52px;box-shadow:0 0 0 9px #000}}
#map{position:absolute;inset:0}
.glass{background:var(--gl);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--gb);box-shadow:0 10px 40px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.6)}
.abs{position:absolute}#st{top:calc(12px + env(safe-area-inset-top,0px));left:14px;padding:8px 13px;border-radius:20px;font-weight:600;font-size:13px;display:flex;gap:7px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:#30d158;box-shadow:0 0 0 3px rgba(48,209,88,.25)}
#ct{top:calc(12px + env(safe-area-inset-top,0px));right:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
#seg{display:flex;padding:3px;border-radius:20px}button{font:inherit;cursor:pointer}
#seg button{border:0;background:none;color:var(--tx);font-weight:600;font-size:13px;padding:6px 14px;border-radius:17px}#seg .on{background:var(--ac);color:#fff}
#inst{top:calc(60px + env(safe-area-inset-top,0px));left:14px;right:14px;border-radius:26px;padding:14px 16px;display:none;gap:14px;align-items:center}
#inst .ar{font-size:38px;width:48px;text-align:center;color:var(--ac)}#inst b{font-size:22px;display:block}#inst span{color:var(--mu);font-size:14px}
#toast{top:calc(150px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-10px);padding:10px 16px;border-radius:20px;font-weight:600;font-size:13px;opacity:0;transition:.3s;pointer-events:none;max-width:88%;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
#sheet{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border-radius:34px;padding:14px;max-height:62%;overflow:auto}
input{width:100%;border:0;outline:0;background:rgba(127,127,127,.16);color:var(--tx);font:500 17px inherit;padding:13px 16px;border-radius:18px}
.row{display:flex;gap:12px;align-items:center;padding:11px 4px;cursor:pointer}.ic{width:42px;height:42px;border-radius:14px;background:rgba(127,127,127,.18);display:grid;place-items:center;font-size:20px;flex:none}
.t1{font-weight:600;font-size:16px}.t2{color:var(--mu);font-size:13px;margin-top:2px}
.hd{display:flex;gap:12px;align-items:center;margin-bottom:10px}.bk{border:0;width:38px;height:38px;border-radius:50%;background:rgba(127,127,127,.2);font-size:22px}
.card{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-radius:20px;margin-bottom:8px;border:1.5px solid transparent;background:rgba(127,127,127,.12);cursor:pointer}.card.on{border-color:var(--ac);background:rgba(10,132,255,.14)}
.card .r{text-align:right}.card .r b{font-size:20px;display:block}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:10px;margin-top:3px}.tl{background:rgba(255,159,10,.25);color:#c76e00}.ok{background:rgba(48,209,88,.22);color:#18943b}
.go,.end{border:0;color:#fff;font-weight:600;font-size:17px;border-radius:20px;padding:15px;background:var(--ac);width:100%;margin-top:4px}
.nv{display:flex;align-items:center;gap:14px}.big{font-size:28px;font-weight:700}.spd{margin-left:auto;text-align:center}.spd b{font-size:26px;display:block;line-height:1}.spd small{color:var(--mu)}
.end{width:auto;padding:12px 18px;background:#ff453a}#tl{margin-top:10px;padding:10px 12px;border-radius:16px;background:rgba(127,127,127,.14);font-weight:600;font-size:14px}
.tm{background:#fff;color:#b45f00;font:700 12px -apple-system,sans-serif;padding:4px 8px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.25);white-space:nowrap}
.car{width:40px;height:40px}
#st{padding:6px 15px 6px 6px;gap:10px;border-radius:24px}#st b{font-size:15px;display:block;line-height:1.15;letter-spacing:.2px}#st small{font-size:11px;color:var(--mu);display:flex;align-items:center;gap:5px;font-weight:600}#st .dot{width:6px;height:6px;box-shadow:0 0 0 2px rgba(48,209,88,.25)}
#loc{width:42px;height:42px;border-radius:50%;padding:0;font-size:17px;color:var(--ac)}
</style></head><body><div id="app"><div id="map"></div>
<div id="st" class="abs glass"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3aa0ff"/><stop offset="1" stop-color="#0a4fd6"/></linearGradient></defs><rect width="34" height="34" rx="11" fill="url(#lg)"/><path d="M8 25c4-1 5-5 9-5s5 4 9 3" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="2" stroke-linecap="round"/><text x="17" y="19" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-weight="800" font-size="15" fill="#fff">67</text></svg><div><b>Enam Tuju</b><small><i class="dot"></i><span id="stt">Estimated traffic</span></small></div></div>
<div id="ct" class="abs"><button id="loc" class="glass" onclick="locate()" aria-label="My location">➤</button><div id="seg" class="glass"><button id="b3" class="on" onclick="setM(1)">3D</button><button id="b2" onclick="setM(0)">2D</button></div></div>
<div id="inst" class="abs glass"><div class="ar" id="ia">↑</div><div><b id="id">–</b><span id="in">–</span></div></div>
<div id="toast" class="abs glass"></div><div id="sheet" class="abs glass"></div></div>
<script>
/* ---- CONFIG ---- */
const TOMTOM_KEY='';      // optional: free key from developer.tomtom.com adds real traffic flow tiles
const DEFAULT_TOLL=2.5;   // RM, used when OSM has no "charge" tag. Edit FEES for known plazas.
const FEES={};            // e.g. {'Sungai Besi':3.4} matched against plaza name
const OSRM='https://router.project-osrm.org';  // public demo: swap for your own OSRM/Valhalla in production
const PRE=[{n:'KLCC, Kuala Lumpur',ic:'🏙️',c:[101.7117,3.1579]},{n:'KLIA',ic:'✈️',c:[101.7072,2.7456]},{n:'George Town, Penang',ic:'🌉',c:[100.3288,5.4141]},{n:'JB CIQ, Johor Bahru',ic:'🛂',c:[103.7678,1.4617]},{n:'Genting Highlands',ic:'⛰️',c:[101.7939,3.4234]}];
/* ---- helpers ---- */
const $=q=>document.querySelector(q),D2R=Math.PI/180;
const hav=(a,b)=>{const x=Math.sin((b[1]-a[1])*D2R/2)**2+Math.cos(a[1]*D2R)*Math.cos(b[1]*D2R)*Math.sin((b[0]-a[0])*D2R/2)**2;return 12742000*Math.asin(Math.sqrt(x))};
const brg=(a,b)=>{const dl=(b[0]-a[0])*D2R,y=Math.sin(dl)*Math.cos(b[1]*D2R),x=Math.cos(a[1]*D2R)*Math.sin(b[1]*D2R)-Math.sin(a[1]*D2R)*Math.cos(b[1]*D2R)*Math.cos(dl);return(Math.atan2(y,x)/D2R+360)%360};
const fd=m=>m<950?Math.max(10,Math.round(m/10)*10)+' m':(m/1000).toFixed(1)+' km';
const ang=(a,b,e)=>a+(((b-a+540)%360)-180)*e;
let origin=[101.6869,3.1343],st='idle',m3=true,dest=null,rts=[],sel=0,cur=null,s=0,spd=0,carH=0,loop=0,last=0,tt,paid=0;
let gps=null,gid=null,mode='gps',gi=0,offN=0,rerouting=0;
function gpsStart(){if(!navigator.geolocation)return toast('GPS is not supported on this device.');if(gid!=null)return;gid=navigator.geolocation.watchPosition(onGps,e=>toast(e.code==1?'Location is blocked. Allow it in your browser settings.':'GPS signal lost.'),{enableHighAccuracy:true,maximumAge:1000,timeout:15000})}
function onGps(p){const c=p.coords,pt=[c.longitude,c.latitude],pv=gps;let h=pv?pv.h:0;if(c.heading!=null&&!isNaN(c.heading)&&c.speed>1)h=c.heading;else if(pv&&hav(pv.p,pt)>4)h=brg(pv.p,pt);
 gps={p:pt,h,v:(c.speed||0)*3.6,acc:c.accuracy};$('#loc').style.color=c.accuracy<30?'#30d158':'#ff9f0a';
 if(!pv&&st=='idle')map.flyTo({center:pt,zoom:13.5});
 if(st=='nav'){if(mode=='gps')gpsNav()}else{origin=pt;car.setLngLat(pt).setRotation(h)}}
function gpsNav(){const r=cur,pt=gps.p;let bi=gi,bd=1e9;for(let i=Math.max(0,gi-40);i<=Math.min(r.c.length-1,gi+400);i++){const d=hav(pt,r.c[i]);if(d<bd){bd=d;bi=i}}
 if(bd>70){if(++offN>=3)reroute()}else{offN=0;gi=bi;s=r.cum[bi]}
 spd=gps.v;car.setLngLat(pt).setRotation(gps.h);map.easeTo({center:pt,bearing:gps.h,pitch:m3?62:0,zoom:m3?17:16.3,duration:1000,easing:t=>t});
 if(r.len-s<30){toast('You’ve arrived at '+dest.n);return stop()}hud(r)}
async function reroute(){if(rerouting)return;rerouting=1;toast('Off route · rerouting…');try{const j=await(await fetch(`${OSRM}/route/v1/driving/${gps.p};${dest.c}?overview=full&geometries=geojson&steps=true`)).json();const n=prep(j.routes[0]);n.w=0;rts=[n];sel=0;cur=n;gi=0;s=0;offN=0;draw();tolls([n])}catch(e){toast('Could not reroute. Check your connection.')}rerouting=0}
function locate(){gpsStart();if(gps)map.flyTo({center:gps.p,zoom:15,bearing:0,pitch:m3?50:0});else toast('Waiting for GPS signal…')}
gpsStart();
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:origin,zoom:11,pitch:50,attributionControl:{compact:true}});
const carEl=document.createElement('div');carEl.className='car';carEl.innerHTML='<svg viewBox="0 0 40 40" width="40" height="40"><circle cx="20" cy="20" r="18" fill="rgba(10,132,255,.22)"/><path d="M20 6l11 26-11-6-11 6z" fill="#0a84ff" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/></svg>';
const car=new maplibregl.Marker({element:carEl,rotationAlignment:'map',pitchAlignment:'map'}).setLngLat(origin).addTo(map);
let marks=[];const clr=()=>{marks.forEach(m=>m.remove());marks=[]};
map.on('load',()=>{
 if(!map.getLayer('building-3d')&&map.getSource('openmaptiles'))map.addLayer({id:'b3d',type:'fill-extrusion',source:'openmaptiles','source-layer':'building',minzoom:14,paint:{'fill-extrusion-color':'#d9dde4','fill-extrusion-height':['coalesce',['get','render_height'],8],'fill-extrusion-opacity':.85}});
 if(TOMTOM_KEY){map.addSource('tt',{type:'raster',tileSize:256,tiles:[`https://api.tomtom.com/traffic/map/4/tile/flow/relative0/{z}/{x}/{y}.png?key=${TOMTOM_KEY}`]});map.addLayer({id:'ttl',type:'raster',source:'tt',paint:{'raster-opacity':.8}});$('#stt').textContent='Live traffic (TomTom)'}
 const E={type:'FeatureCollection',features:[]};map.addSource('alt',{type:'geojson',data:E});map.addSource('rt',{type:'geojson',data:E});
 map.addLayer({id:'alt',type:'line',source:'alt',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#8e96a3','line-width':6,'line-dasharray':[1,2]}});
 map.addLayer({id:'rtc',type:'line',source:'rt',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#fff','line-width':13}});
 map.addLayer({id:'rt',type:'line',source:'rt',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':['step',['get','l'],'#30d158',.35,'#ffb800',.65,'#ff453a'],'line-width':8}});
 ui()});
/* ---- route data ---- */
function prep(r){const c=r.geometry.coordinates,cum=[0];for(let i=1;i<c.length;i++)cum.push(cum[i-1]+hav(c[i-1],c[i]));r.c=c;r.cum=cum;r.len=cum[cum.length-1];
 const N=Math.min(60,Math.max(8,Math.round(r.len/1500)));r.idx=Array.from({length:N+1},(_,k)=>Math.floor(k*(c.length-1)/N));
 const h=new Date().getHours(),rush=(h>=7&&h<10)||(h>=17&&h<21)?.2:0;r.lv=Array.from({length:N},()=>Math.min(1,Math.random()*.45+rush));
 let a=0;r.steps=r.legs[0].steps.map(p=>{const o={p,at:a};a+=p.distance;return o});r.tolls=null;r.fee=0;return r}
const avg=r=>r.lv.reduce((a,b)=>a+b,0)/r.lv.length,mins=r=>r.duration/60*(1+.6*avg(r));
const fc=r=>({type:'FeatureCollection',features:r.lv.map((l,k)=>({type:'Feature',properties:{l},geometry:{type:'LineString',coordinates:r.c.slice(r.idx[k],r.idx[k+1]+1)}}))});
const at=(r,d)=>{let lo=0,hi=r.cum.length-1;while(hi-lo>1){const m=(lo+hi)>>1;r.cum[m]<=d?lo=m:hi=m}const f=Math.min(1,(d-r.cum[lo])/((r.cum[hi]-r.cum[lo])||1));return[r.c[lo][0]+(r.c[hi][0]-r.c[lo][0])*f,r.c[lo][1]+(r.c[hi][1]-r.c[lo][1])*f]};
async function tolls(list){const b=list.flatMap(r=>r.c).reduce((o,p)=>[Math.min(o[0],p[0]),Math.min(o[1],p[1]),Math.max(o[2],p[0]),Math.max(o[3],p[1])],[999,999,-999,-999]);
 let nodes=[];try{const q=`[out:json][timeout:25];node["barrier"="toll_booth"](${b[1]-.01},${b[0]-.01},${b[3]+.01},${b[2]+.01});out;`;nodes=(await(await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(q)})).json()).elements}catch(e){}
 list.forEach(r=>{const seen={},out=[];nodes.forEach(n=>{const p=[n.lon,n.lat];let bi=-1,bd=90;for(let i=0;i<r.c.length;i+=2){const d=hav(p,r.c[i]);if(d<bd){bd=d;bi=i}}if(bi<0)return;const k=Math.round(n.lat/.004)+','+Math.round(n.lon/.004);if(seen[k])return;seen[k]=1;const t=n.tags||{},f=FEES[t.name]??(parseFloat(t.charge)||DEFAULT_TOLL);out.push({p,s:r.cum[bi],f,n:t.name||'Toll plaza'})});r.tolls=out.sort((a,b)=>a.s-b.s);r.fee=out.reduce((a,t)=>a+t.f,0)});
 if(st=='preview')ui();showTolls()}
function showTolls(){clr();if(!cur||!cur.tolls)return;cur.tolls.forEach(t=>{const e=document.createElement('div');e.className='tm';e.textContent='RM '+t.f.toFixed(2);marks.push(new maplibregl.Marker({element:e}).setLngLat(t.p).addTo(map))});if(dest){const e=document.createElement('div');e.className='tm';e.style.color='#0a84ff';e.textContent='📍 '+dest.n;marks.push(new maplibregl.Marker({element:e,offset:[0,-14]}).setLngLat(dest.c).addTo(map))}}
/* ---- UI ---- */
const places=a=>a.map((d,i)=>`<div class="row" onclick="pick(${i})"><b class="ic">${d.ic||'📍'}</b><div><div class="t1">${d.n}</div></div></div>`).join('');
let shown=PRE;
function ui(){const sh=$('#sheet');
 if(st=='idle')sh.innerHTML=`<input id="q" placeholder="Where to in Malaysia?" oninput="srch(this.value)"><div id="ls">${places(shown)}</div>`;
 else if(st=='preview')sh.innerHTML=`<div class="hd"><button class="bk" onclick="back()" aria-label="Back">‹</button><div><div class="t1">${dest.n}</div><div class="t2">Traffic is estimated${TOMTOM_KEY?'':' · add a TomTom key for live data'}</div></div></div>`+rts.map((r,i)=>`<div class="card ${i==sel?'on':''}" onclick="pickR(${i})"><div><div class="t1">${i?'Alternative':'Fastest'}</div><div class="t2">${(r.len/1000).toFixed(1)} km</div></div><div class="r"><b>${Math.round(mins(r))} min</b>${r.tolls?`<span class="pill ${r.fee?'tl':'ok'}">${r.fee?'Toll ≈ RM '+r.fee.toFixed(2):'No tolls'}</span>`:'<span class="t2">Checking tolls…</span>'}</div></div>`).join('')+'<button class="go" onclick="start(\'gps\')">Start with GPS</button><button class="go" style="background:rgba(127,127,127,.25);color:var(--tx)" onclick="start(\'demo\')">Demo drive</button>';
 else sh.innerHTML=`<div class="nv"><div><div class="big" id="eta">–</div><div class="t2" id="sub">–</div></div><div class="spd"><b id="spd">0</b><small>km/h</small></div><button class="end" onclick="stop()">End</button></div><div id="tl"></div>`}
let sq;function srch(v){clearTimeout(sq);if(v.length<3){shown=PRE;$('#ls').innerHTML=places(shown);return}sq=setTimeout(async()=>{try{const j=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&countrycodes=my&limit=6&q='+encodeURIComponent(v))).json();shown=j.map(x=>({n:x.display_name.split(',').slice(0,3).join(','),c:[+x.lon,+x.lat]}));$('#ls').innerHTML=places(shown)||'<div class="t2" style="padding:12px">No places found.</div>'}catch(e){toast('Search unavailable. Check your connection.')}},450)}
async function pick(i){dest=shown[i];toast('Finding routes…');try{const j=await(await fetch(`${OSRM}/route/v1/driving/${origin};${dest.c}?alternatives=true&overview=full&geometries=geojson&steps=true`)).json();if(!j.routes)throw 0;rts=j.routes.slice(0,2).map(prep);sel=0;cur=rts[0];st='preview';draw();ui();tolls(rts)}catch(e){toast('No route found. Try another destination.')}}
function draw(){map.getSource('rt').setData(fc(cur));const o=rts[1-sel];map.getSource('alt').setData(o&&st=='preview'?{type:'Feature',geometry:{type:'LineString',coordinates:o.c}}:{type:'FeatureCollection',features:[]});
 if(st=='preview'){const b=cur.c.reduce((a,p)=>a.extend(p),new maplibregl.LngLatBounds(cur.c[0],cur.c[0]));map.fitBounds(b,{padding:{top:90,bottom:330,left:40,right:40},pitch:m3?40:0,bearing:0,duration:900})}car.setLngLat(origin);showTolls()}
function pickR(i){sel=i;cur=rts[i];draw();ui()}
function back(){st='idle';dest=null;rts=[];cur=null;clr();map.getSource('rt').setData({type:'FeatureCollection',features:[]});map.getSource('alt').setData({type:'FeatureCollection',features:[]});shown=PRE;ui()}
function start(m){if(m=='gps'&&!gps){gpsStart();return toast('Waiting for GPS signal. Try again in a moment.')}mode=m;st='nav';s=0;gi=0;offN=0;spd=0;paid=0;cur.w=0;$('#inst').style.display='flex';draw();ui();
 if(m=='demo'){toast('Demo drive · 3× speed');last=performance.now();loop=requestAnimationFrame(frame)}else{toast('Navigating with GPS');gpsNav()}}
function stop(){cancelAnimationFrame(loop);st='preview';$('#inst').style.display='none';draw();ui();map.easeTo({pitch:m3?40:0,bearing:0})}
function setM(v){m3=!!v;$('#b3').classList.toggle('on',m3);$('#b2').classList.toggle('on',!m3);if(st=='idle')map.easeTo({pitch:m3?50:0})}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3200)}
const arrow=m=>/uturn/.test(m||'')?'↶':/left/.test(m||'')?'↰':/right/.test(m||'')?'↱':'↑';
const say=p=>{const m=p.maneuver;if(m.type=='arrive')return'Arrive at '+dest.n;if(/roundabout|rotary/.test(m.type))return'Take the roundabout'+(p.name?' to '+p.name:'');const d=m.modifier?m.modifier[0].toUpperCase()+m.modifier.slice(1):'Continue';return(m.type=='turn'||m.type=='end of road'?'Turn ':m.type=='depart'?'Head ':'')+(m.type=='turn'||m.type=='end of road'||m.type=='depart'?d.toLowerCase():d)+(p.name?' onto '+p.name:'')};
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const r=cur,ci=Math.min(r.lv.length-1,r.idx.findIndex(i=>r.cum[i]>s)-1<0?0:r.idx.findIndex(i=>r.cum[i]>s)-1);
 const kmh=85*(1-.55*r.lv[ci]);spd+=(kmh-spd)*Math.min(1,dt*2);s+=spd/3.6*3*dt;
 if(s>=r.len){toast('You’ve arrived at '+dest.n);return stop()}
 const p=at(r,s),n=at(r,Math.min(r.len,s+30)),hd=brg(p,n);carH=ang(carH,hd,1-Math.exp(-dt*6));car.setLngLat(p).setRotation(carH);
 map.jumpTo({center:p,bearing:carH,pitch:m3?62:0,zoom:m3?17:16.3});
 hud(r);loop=requestAnimationFrame(frame)}
function hud(r){const rem=r.len-s,mn=mins(r)*rem/r.len,arr=new Date(Date.now()+mn*60000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
