<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Food Diary</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --wood1:#8a5a33;--wood2:#7a4c28;--wood3:#5e3a1d;
  --paper:#fbf3de;--paper-line:#d9c9a3;--ink:#3b2a1a;--ink-soft:#7a6244;
  --accent:#a8421f;--leather:#4a2c14;--tape:#e9d48a;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --wood1:#4a2f1a;--wood2:#3e2714;--wood3:#2c1b0d;
    --paper:#e9dcba;--paper-line:#c4b186;--ink:#2e2013;--ink-soft:#6b5538;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--ink);font-family:'Lora',Georgia,serif;
  background-color:var(--wood1);
  background-image:
    repeating-linear-gradient(90deg,rgba(0,0,0,.10) 0 2px,transparent 2px 9px),
    repeating-linear-gradient(90deg,var(--wood2) 0 120px,var(--wood1) 120px 240px,var(--wood3) 240px 330px),
    repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 7px);
}
.book{max-width:560px;margin:0 auto;padding:18px 14px 60px}
.cover{
  background:var(--leather);color:#f1deb8;border-radius:10px 10px 0 0;padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;
  border:2px dashed rgba(241,222,184,.35);outline:6px solid var(--leather);
  box-shadow:0 6px 14px rgba(0,0,0,.4);
}
.cover h1{font-family:'Caveat',cursive,sans-serif;font-size:2rem;margin:0;font-weight:700}
.page{
  background:var(--paper);
  background-image:repeating-linear-gradient(transparent 0 31px,var(--paper-line) 31px 32px);
  padding:20px 18px 24px 26px;border-radius:0 0 8px 8px;
  box-shadow:0 14px 26px rgba(0,0,0,.45);border-left:6px double #c9a46a;
}
.hand{font-family:'Caveat',cursive,sans-serif}
.datebar{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:10px}
.datebar button,.datebar input{
  font:inherit;color:inherit;background:transparent;border:1.5px solid var(--ink-soft);
  border-radius:6px;padding:6px 10px;cursor:pointer;
}
.datebar button{font-size:1.1rem;min-width:40px}
.datebar input{font-family:'Caveat',cursive,sans-serif;font-size:1.25rem;flex:1;text-align:center;min-width:0}
.datebar button:focus-visible,.datebar input:focus-visible,.chip:focus-visible,textarea:focus-visible,.save:focus-visible,.pick:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.title{font-size:1.9rem;line-height:32px;margin:6px 0 2px;font-weight:700}
.sub{font-size:1.25rem;line-height:32px;color:var(--ink-soft);margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{
  font-family:'Caveat',cursive,sans-serif;font-size:1.25rem;background:transparent;color:var(--ink);
  border:1.5px solid var(--ink-soft);border-radius:20px;padding:2px 14px;cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff8e8}
.pick{
  display:block;border:2px dashed var(--ink-soft);border-radius:8px;text-align:center;
  padding:14px;cursor:pointer;font-size:1.3rem;margin:8px 0;position:relative;overflow:hidden;background:rgba(255,255,255,.35)
}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.pick img{max-width:100%;max-height:180px;display:block;margin:0 auto 6px;border-radius:3px}
textarea{
  width:100%;min-height:96px;resize:vertical;font-family:'Caveat',cursive,sans-serif;font-size:1.35rem;line-height:32px;
  color:var(--ink);background:rgba(255,255,255,.4);border:1.5px solid var(--paper-line);border-radius:6px;padding:6px 8px
}
.save{
  font-family:'Caveat',cursive,sans-serif;font-size:1.4rem;font-weight:700;background:var(--leather);color:#f1deb8;
  border:0;border-radius:8px;padding:6px 22px;cursor:pointer;margin-top:8px;box-shadow:0 3px 0 rgba(0,0,0,.35)
}
.save:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.err{color:var(--accent);font-size:1.15rem;min-height:1.2em}
hr{border:0;border-top:2px dashed var(--paper-line);margin:18px 0}
.entry{position:relative;margin:26px 0 10px}
.polaroid{
  background:#fffdf6;padding:10px 10px 8px;box-shadow:0 4px 10px rgba(60,35,10,.35);transform:rotate(-1.2deg);position:relative;
}
.entry:nth-child(even) .polaroid{transform:rotate(1.2deg)}
.polaroid::before{content:"";position:absolute;top:-10px;left:50%;width:84px;height:22px;margin-left:-42px;background:var(--tape);opacity:.85;transform:rotate(-3deg)}
.polaroid img{width:100%;display:block;max-height:340px;object-fit:cover}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px}
.meal{font-family:'Caveat',cursive,sans-serif;font-size:1.6rem;font-weight:700;color:var(--accent)}
.time{font-family:'Caveat',cursive,sans-serif;font-size:1.2rem;color:var(--ink-soft)}
.note{font-family:'Caveat',cursive,sans-serif;font-size:1.4rem;line-height:32px;margin:6px 0 0;white-space:pre-wrap;word-wrap:break-word}
.del{background:none;border:0;color:var(--ink-soft);font-family:'Caveat',cursive,sans-serif;font-size:1.1rem;cursor:pointer;text-decoration:underline;padding:0}
.del:focus-visible{outline:3px solid var(--accent)}
.empty{font-size:1.4rem;line-height:32px;color:var(--ink-soft);text-align:center;margin:14px 0}
@media (prefers-reduced-motion:no-preference){.entry.new{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.92);opacity:0}}}
</style>
</head>
<body>
<main class="book">
  <div class="cover"><h1>My Food Diary</h1><span class="hand" style="font-size:1.3rem" id="count"></span></div>
  <section class="page">
    <div class="datebar">
      <button id="prev" aria-label="Previous day">‹</button>
      <input type="date" id="date" aria-label="Choose day">
      <button id="next" aria-label="Next day">›</button>
    </div>
    <h2 class="title hand" id="heading"></h2>
    <p class="sub hand" id="sub"></p>

    <div class="chips" role="group" aria-label="Meal">
      <button class="chip" data-m="Breakfast" aria-pressed="true">Breakfast</button>
      <button class="chip" data-m="Lunch" aria-pressed="false">Lunch</button>
      <button class="chip" data-m="Dinner" aria-pressed="false">Dinner</button>
      <button class="chip" data-m="Snack" aria-pressed="false">Snack</button>
    </div>
    <label class="pick hand" id="pick">
      <span id="pickText">Tap to add a photo</span>
      <input type="file" accept="image/*" id="file">
    </label>
    <textarea id="text" placeholder="What did you eat? How did it taste?" aria-label="Notes"></textarea>
    <div class="err" id="err" role="status"></div>
    <button class="save" id="save">Save to diary</button>

    <hr>
    <div id="list"></div>
  </section>
</main>
<script>
(function(){
  var KEY='foodDiaryEntries';
  var entries=[];
  var mem=false;
  try{entries=JSON.parse(localStorage.getItem(KEY)||'[]')||[];}catch(e){entries=[];mem=true;}
  var $=function(id){return document.getElementById(id)};
  var meal='Breakfast',photo=null,day=today();

  function pad(n){return n<10?'0'+n:''+n}
  function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function today(){return iso(new Date())}
  function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
  function persist(){
    try{localStorage.setItem(KEY,JSON.stringify(entries));$('err').textContent='';return true;}
    catch(e){$('err').textContent='Diary is full or storage is blocked. Try a smaller photo or delete an old entry.';return false;}
  }
  function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

  function render(newId){
    $('date').value=day;
    var d=parse(day);
    $('heading').textContent=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
    var list=entries.filter(function(e){return e.date===day}).sort(function(a,b){return a.ts-b.ts});
    $('sub').textContent=day===today()?'Today I ate…':'On this day I ate…';
    $('count').textContent=list.length?list.length+(list.length>1?' meals':' meal'):'';
    if(!list.length){$('list').innerHTML='<p class="empty hand">Nothing written yet. Add your first meal above.</p>';return;}
    $('list').innerHTML=list.map(function(e){
      var t=new Date(e.ts).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
      return '<article class="entry'+(e.id===newId?' new':'')+'">'+
        '<div class="polaroid">'+(e.photo?'<img alt="Photo of '+esc(e.meal.toLowerCase())+'" src="'+e.photo+'">':'')+
        '<div class="meta"><span class="meal">'+esc(e.meal)+'</span><span class="time">'+t+'</span></div></div>'+
        (e.text?'<p class="note">'+esc(e.text)+'</p>':'')+
        '<button class="del" data-id="'+e.id+'">Tear out this entry</button></article>';
    }).join('');
  }

  function shift(n){var d=parse(day);d.setDate(d.getDate()+n);day=iso(d);render();}
  $('prev').onclick=function(){shift(-1)};
  $('next').onclick=function(){shift(1)};
  $('date').onchange=function(){if(this.value){day=this.value;render();}};

  document.querySelectorAll('.chip').forEach(function(c){
    c.onclick=function(){
      meal=c.dataset.m;
      document.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed',x===c?'true':'false')});
    };
  });

  $('save').onclick=function(){
    var text=$('text').value.trim();
    if(!photo&&!text){$('err').textContent='Add a photo or write a few words first.';return;}
    var now=new Date();
    var d=parse(day);d.setHours(now.getHours(),now.getMinutes(),now.getSeconds());
    var e={id:'e'+now.getTime(),date:day,meal:meal,text:text,photo:photo,ts:d.getTime()};
    entries.push(e);
    if(!persist()&&!mem){entries.pop();return;}
    photo=null;$('text').value='';
    $('pick').innerHTML='<span id="pickText">Tap to add a photo</span><input type="file" accept="image/*" id="file">';
    bindFile();
    render(e.id);
  };

  $('list').onclick=function(ev){
    var b=ev.target.closest('.del');if(!b)return;
    if(!confirm('Tear out this entry?'))return;
    entries=entries.filter(function(e){return e.id!==b.dataset.id});
    persist();render();
  };

  function bindFile(){
    var inp=$('file');
    inp.onchange=function(){
      var f=inp.files&&inp.files[0];if(!f)return;
      var r=new FileReader();
      r.onload=function(){
        var img=new Image();
        img.onload=function(){
          var s=Math.min(1,720/Math.max(img.width,img.height));
          var c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          photo=c.toDataURL('image/jpeg',0.72);
          $('pick').innerHTML='<img alt="Chosen photo" src="'+photo+'"><span>Tap to change photo</span><input type="file" accept="image/*" id="file">';
          bindFile();
        };
        img.src=r.result;
      };
      r.readAsDataURL(f);
    };
  }
  bindFile();
  render();
})();
</script>
</body>
</html>
